[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection competition code"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
modal = [
    "modal==1.5.3",
]
gpu = [
    "pydicom==3.0.1",
    "pillow==11.3.0",
    "pylibjpeg==2.0.1",
    "pylibjpeg-libjpeg==2.3.0",
    "pylibjpeg-openjpeg==2.4.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
